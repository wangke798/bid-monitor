  # ---------- 数据源 5: 招标网 ----------
  - name: "招标网"
    site: "招标网"
    fetch_type: "html"
    html_parser: "zhaobiao"
    playwright_url: "https://zb.zhaobiao.cn/bidding.html"
    wait_selector: "tbody#datatbody"
    list_path: "list"
    match_fields:
      - "title"
    id_field: "id"
    title_field: "title"
    type_label: "招标公告"
    start_time_field: "publishedTime"
    time_format: "date"
    detail_url_template: "{detail_url}"

  # ---------- 数据源 6: 中国三峡集团招标 ----------
  - name: "中国三峡集团"
    site: "三峡集团招标"
    fetch_type: "html"
    html_parser: "ctg"
    playwright_url: "https://eps.ctg.com.cn/cms/channel/1ywgg1/index.htm"
    wait_selector: "ul#list1"
    list_path: "list"
    match_fields:
      - "title"
    id_field: "id"
    title_field: "title"
    type_label: "招标公告"
    start_time_field: "publishedTime"
    time_format: "date"
    detail_url_template: "{detail_url}"

  # ---------- 数据源 7: 中国通用招标网 ----------
  - name: "中国通用招标网"
    site: "通用招标网"
    fetch_type: "html"
    html_parser: "tongyong"
    playwright_url: "https://cgci.china-tender.com.cn/zbgg/index.jhtml"
    wait_selector: "div.List2"
    list_path: "list"
    match_fields:
      - "title"
    id_field: "id"
    title_field: "title"
    type_label: "招标公告"
    start_time_field: "publishedTime"
    time_format: "date"
    detail_url_template: "{detail_url}"

