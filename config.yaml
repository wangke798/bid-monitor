  # ---------- 数据源 11: 中国石油招标中心 ----------
  - name: "中国石油招标中心"
    site: "中国石油招标中心"
    api_url: "https://www2.cnpcbidding.com/project/index/centerNew"
    method: "GET"
    ssl_verify: false
    headers:
      Accept: "application/json, text/plain, */*"
    list_path: "data"
    match_fields:
      - "goodsName"
      - "projectName"
    id_field: "goodsId"
    title_field: "goodsName"
    type_label: "招标公告"
    start_time_field: "createdTime"
    time_format: "date"
    detail_url_template: "https://www2.cnpcbidding.com/#/wel/commodityDetails?goodsId={goodsId}&bidSaleEndDateTime={bidSaleEndDateTime}"

  # ---------- 数据源 12: 中国政府采购网-中央公告 ----------
