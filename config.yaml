
# ============ 全局配置(所有数据源共享,可被单个数据源覆盖) ============

# 关键词: 命中其中任意一个即视为相关内容
keywords:
  - "信息安全"
  - "网络安全"
  - "数据安全"
  - "加密"
  - "防火墙"
  - "流量计"
  - "数据集"
  - "数据标注"
  - "数据治理"

# 是否区分大小写
case_sensitive: false

# 请求超时(秒)
timeout: 15

# 每隔多少分钟检查一次(本地运行)
interval_minutes: 30

# 去重记录文件(已推送过的内容不再重复推送)
seen_file: "seen.json"

# 企业微信群机器人 Webhook
# 部署到 GitHub Actions/服务器时,请放到环境变量 BID_WEBHOOK,程序会自动覆盖此行。
wechat_webhook: ""

# ============ 数据源列表 ============
sources:
  # ---------- 数据源 1: 国家管网集团电子招标平台 ----------
  - name: "国家管网"
    site: "国家管网招标"
    api_url: "https://iscmdzzb.pipechina.com.cn:8081/api/saas-portal/noauth/trans/trade/pageEs"
    method: "POST"
    body:
      pageNum: 1
      pageSize: 50
      tradePattern: "981931056975052801"
      noticeType: 1
      businessName: ""
      releaseStartTime: 0
      releaseEndTime: 0
      purchaseProjectType: ""
      purchaseMode:
      purchasePatternId: ""
      tendererId: ""
    use_today_release_range: true
    headers:
      Content-Type: "application/json;charset=UTF-8"
    list_path: "data.list"
    match_fields:
      - "businessName"
    id_field: "id"
    title_field: "businessName"
    start_time_field: "releaseTime"
    time_format: "ms"
    deadline_field: ""
    detail_url_template: "https://iscmdzzb.pipechina.com.cn:8081/web-portal/index.html?#/trade-info-detail?id={id}&noticeType=1&publishStatus=1&systemStatus"

  # ---------- 数据源 2: 万项网-推荐招标 ----------
  - name: "万项网-推荐招标"
    site: "万项网招标"
    api_url: "https://www.chinazbcg.com/zbcg/web/infosListMore"
    method: "GET"
    params: { tid: 23, pageSize: 50, pageNo: 1 }
    list_path: "result.list"
    match_fields: ["title"]
    id_field: "id"
    title_field: "title"
    type_label: "推荐招标"
    start_time_field: "updateTime"
    time_format: "date"
    detail_url_template: "https://www.chinazbcg.com/pagemore/{id}?type=info"

  # ---------- 数据源 3: 万项网-招标公告 ----------
  - name: "万项网-招标公告"
    site: "万项网招标"
    api_url: "https://www.chinazbcg.com/zbcg/web/infosListMore"
    method: "GET"
    params: { tid: 2, pageSize: 50, pageNo: 1 }
    list_path: "result.list"
    match_fields: ["title"]
    id_field: "id"
    title_field: "title"
    type_label: "招标公告"
    start_time_field: "updateTime"
    time_format: "date"
    detail_url_template: "https://www.chinazbcg.com/pagemore/{id}?type=info"

  # ---------- 数据源 4: 万项网-国际招标 ----------
  - name: "万项网-国际招标"
    site: "万项网招标"
    api_url: "https://www.chinazbcg.com/zbcg/web/infosListMore"
    method: "GET"
    params: { tid: 12, pageSize: 50, pageNo: 1 }
    list_path: "result.list"
    match_fields: ["title"]
    id_field: "id"
    title_field: "title"
    type_label: "国际招标"
    start_time_field: "updateTime"
    time_format: "date"
    detail_url_template: "https://www.chinazbcg.com/pagemore/{id}?type=info"

